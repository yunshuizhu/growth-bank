<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>成长银行 - 数据备份</title>
<style>
  body { font-family: -apple-system, "Microsoft YaHei", sans-serif; background: #0d1626; color: #e2e8f0; max-width: 640px; margin: 0 auto; padding: 2rem 1rem; }
  h1 { font-size: 1.4rem; }
  .card { background: #1e293b; border-radius: 12px; padding: 1.2rem; margin: 1rem 0; }
  button { display: block; width: 100%; padding: 0.9rem; border: none; border-radius: 8px; font-size: 1rem; cursor: pointer; margin: 0.6rem 0; }
  .export { background: #38bdf8; color: #0b1220; }
  .import { background: #34d399; color: #0b1220; }
  textarea { width: 100%; height: 140px; background: #0f172a; color: #e2e8f0; border: 1px solid #334155; border-radius: 8px; padding: 0.8rem; font-family: monospace; font-size: 0.8rem; box-sizing: border-box; }
  .tip { color: #94a3b8; font-size: 0.85rem; line-height: 1.6; }
</style>
</head>
<body>
  <h1>💾 成长银行 · 数据备份</h1>
  <div class="tip">
    数据存在本机浏览器的 localStorage 中。建议定期「导出」备份，下载成文件永久保存；
    换电脑或数据被清空时，用「导入」即可恢复。
  </div>

  <div class="card">
    <button class="export" onclick="exportData()">⬇ 导出数据（下载备份文件）</button>
    <div class="tip">导出后会下载一个 .json 文件，请把它保存到安全的地方（如 U 盘、网盘）。</div>
  </div>

  <div class="card">
    <textarea id="data" placeholder="恢复时：先打开备份 .json 文件，复制全部内容粘贴到这里，再点下面的按钮"></textarea>
    <button class="import" onclick="importData()">⬆ 导入数据（从备份恢复）</button>
  </div>

<script>
function exportData() {
  const all = {};
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    all[k] = localStorage.getItem(k);
  }
  const blob = new Blob([JSON.stringify(all, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = '成长银行备份-' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
  URL.revokeObjectURL(url);
}
function importData() {
  const text = document.getElementById('data').value.trim();
  if (!text) { alert('请先粘贴备份内容到上面的文本框'); return; }
  try {
    const data = JSON.parse(text);
    let n = 0;
    for (const [k, v] of Object.entries(data)) { localStorage.setItem(k, v); n++; }
    alert('恢复成功！共恢复 ' + n + ' 项数据，请重新打开应用查看。');
  } catch (e) {
    alert('备份内容格式错误：' + e.message);
  }
}
</script>
</body>
</html>
