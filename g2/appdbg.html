    document.open("text/html", "replace");
    document.write(text);
    document.close();

/* ---- \u6570\u636E\u8FC1\u79FB\uFF1A\u65E7\u7248\u672C\u6635\u79F0/\u4EFB\u52A1\u81EA\u52A8\u5347\u7EA7 ---- */
function migrateDB(f){
  const RENAMES={'\u54E5\u54E5':'\u6C90\u6C90','\u59B9\u59B9':'\u661F\u661F','\u5B9D\u5B9D':'\u661F\u661F'};
  ['elder','younger'].forEach(k=>{
    if(RENAMES[DB[k].name]) DB[k].name=RENAMES[DB[k].name];
    // \u540C\u6B65\u4EFB\u52A1\u5217\u8868\uFF1A\u4EE5\u9ED8\u8BA4\u6E05\u5355\u4E3A\u51C6\uFF0C\u4FDD\u7559\u81EA\u5B9A\u4E49\u4EFB\u52A1\u7684 ID \u4E0D\u53D8
    const def=f[k].tasks;
    const custom=DB[k].tasks.filter(t=>!def.find(d=>d.id===t.id));
    // \u9ED8\u8BA4\u4EFB\u52A1\u7528\u6700\u65B0\u5B9A\u4E49\u8986\u76D6\uFF08\u62FE\u53D6\u6700\u65B0 emoji/name/pts/split/timer\uFF09\uFF0C\u4FDD\u7559\u5DF2\u6709\u6253\u5361\u8BB0\u5F55\u517C\u5BB9
    DB[k].tasks=def.map(d=>{
      const old=DB[k].tasks.find(t=>t.id===d.id);
      return old?Object.assign({},old,d):d;
    }).concat(custom);
    // \u540C\u6B65\u5956\u52B1\u5E93
    const defR=f[k].rewards;
    const customR=DB[k].rewards.filter(r=>!defR.find(d=>d.id===r.id));
    DB[k].rewards=defR.map(d=>{
      const old=DB[k].rewards.find(r=>r.id===d.id);
      return old?Object.assign({},old,d):d;
    }).concat(customR);
  });
  // \u4FEE\u6B63 flow \u548C notices \u91CC\u7684\u65E7\u6635\u79F0 + \u65E7\u4EFB\u52A1\u540D
  const FLOW_FIX={'\u54E5\u54E5':'\u6C90\u6C90','\u59B9\u59B9':'\u661F\u661F','\u5B9D\u5B9D':'\u661F\u661F',
    '\u905B\u72D715\u5206\u949F':'\u8DF3\u7EF3100\u4E0B','\u905B\u72D7':'\u8DF3\u7EF3',
    '\u81EA\u5DF1\u7A7F\u8863':'\u9605\u8BFB\u7ED8\u672C15\u5206\u949F','\u81EA\u5DF1\u5403\u996D\u4E0D\u5582':'\u601D\u7EF4\u8BAD\u7EC3\u6E38\u620F'};
  const fix=s=>{ if(!s)return s; let r=String(s); for(const[o,n]of Object.entries(FLOW_FIX)) r=r.split(o).join(n); return r; };
  ['elder','younger'].forEach(k=>{ DB[k].flow=DB[k].flow.map(fl=>{fl.r=fix(fl.r);return fl;}); });
  DB.notices=DB.notices.map(n=>{n.msg=fix(n.msg);return n;});
}
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(DB)); }catch(e){} }

function confetti(n){
  const icons=['\uD83C\uDF89','\u2728','\u2B50','\uD83C\uDF8A','\uD83D\uDC9B','\uD83E\uDE99'];
  for(let i=0;i<(n||24);i++){
    const s=document.createElement('div'); s.className='confetti';
    s.textContent=icons[Math.floor(Math.random()*icons.length)];
    s.style.left=Math.random()*100+'vw';
    s.style.animationDuration=(1.6+Math.random()*1.6)+'s';
    s.style.animationDelay=(Math.random()*.5)+'s';
    document.body.appendChild(s);
    setTimeout(()=>s.remove(),4000);
  }
}

/* ===================== \u8D26\u52A1\u6838\u5FC3 ===================== */
function addFlow(k,s,c,reason){
  DB[k].flow.unshift({d:todayStr(),t:nowHM(),s:s,c:c,r:reason});
  if(DB[k].flow.length>300)DB[k].flow.length=300;
}
function doneToday(k){ const a=DB[k].done[todayStr()]; return Array.isArray(a)?a:[]; }
const doneCount=k=>DB[k].tasks.filter(t=>doneToday(k).includes(t.id)).length;
function streakOf(k){
  const days=Object.keys(DB[k].done).filter(d=>DB[k].done[d]&&DB[k].done[d].length);
  if(!days.length)return 0;
  const set=new Set(days);
  let d=new Date();
  if(!set.has(todayStr())) d.setDate(d.getDate()-1);
  let n=0;
  for(;;){
    const cur=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
    if(!set.has(cur))break;
    n++; d.setDate(d.getDate()-1);
  }
  return n;
}
function isAllDutyDone(k){
  return DB[k].tasks.filter(t=>t.type==='duty').every(t=>doneToday(k).includes(t.id));
}
function mapAdvance(){
  const y=DB.younger; y.mapPos++;
  let gift=null;
  if(y.mapPos>=10){ y.boxTickets++; y.mapPos=0; gift='\uD83C\uDFC6 \u5C0F\u9E7F\u8D70\u5B8C\u5168\u7A0B\uFF01\u83B7\u5F97\u76F2\u76D2\u5238\u00D71'; }
  else if(y.mapPos===5){ y.boxTickets++; gift='\uD83C\uDF81 \u4E2D\u9014\u5B9D\u7BB1\uFF01\u83B7\u5F97\u76F2\u76D2\u5238\u00D71'; }
  if(gift)addFlow('younger','+',0,gift);
  return gift;
}
function completeTask(k,task){
  const ts=todayStr(); const arr=DB[k].done[ts]||(DB[k].done[ts]=[]);
  if(arr.includes(task.id))return null;
  arr.push(task.id);
  if(k==='elder'&&task.type==='duty'){
    DB.elder.contrib+=task.pts; addFlow('elder','+',task.pts,'[\u8D21\u732E] '+task.name);
  }else{
    DB[k].coins+=task.pts; addFlow(k,'+',task.pts,'[\u91D1\u5E01] '+task.name);
    if(k==='younger'&&task.type==='duty')DB.younger.contrib+=1;
  }
  let gift=null;
  if(k==='younger'){
    gift=mapAdvance();
    if(isAllDutyDone('younger')&&!DB.younger.chgDates.includes(ts))DB.younger.chgDates.push(ts);
  }
  save();
  return {gift:gift};
}
function notice(msg,warn){
  DB.notices.unshift({d:todayStr(),t:nowHM(),msg:String(msg),warn:!!warn});
  if(DB.notices.length>80)DB.notices.length=80;
}

let tIdx=0;
const ssOpen=new Set(),ssDone=new Set();
function openTasks(){ tIdx=0; ssOpen.clear(); ssDone.clear(); renderTasks(); go('tasks'); }
function renderTasks(){ renderTasksY(); }
function togSplit(id){ if(ssOpen.has(id))ssOpen.delete(id); else ssOpen.add(id); renderTasks(); }
function ckSS(id,i){
  const key=id+'-'+i;
  if(ssDone.has(key))ssDone.delete(key); else ssDone.add(key);
  renderTasks();
}
function taskCard(t,done){
  const isE=(KID==='elder');
  const ptsHtml=(isE&&t.type==='duty')
    ?'<div class="tc-points g">\u8D21\u732E +'+t.pts+'</div>'
    :'<div class="tc-points">\u91D1\u5E01 +'+t.pts+'</div>';
  const open=ssOpen.has(t.id);
  const tmrHtml=t.timer?`
    <div class="timer-bar"><div class="timer-fill" id="tmrFill"></div></div>
    <div class="timer-num" id="tmrNum">${t.timer}:00</div>
    <button class="btn btn-line" style="min-height:40px" onclick="tmrStart(${t.timer*60})">\u25B6 \u5F00\u59CB\u4E13\u6CE8\u8BA1\u65F6</button>`:'';
  const splitHtml=(t.split&&t.split.length)?`
    <div class="split-link" onclick="togSplit('${t.id}')">${open?'\u25B2 \u6536\u8D77\u5C0F\u6B65\u9AA4':'\u25BC \u8FD9\u4EF6\u4E8B\u592A\u5927\uFF1F\u62C6\u6210\u5C0F\u6B65\u9AA4'}</div>
    ${open?'<div class="substep-list">'+t.split.map((s,i)=>{
      const d=ssDone.has(t.id+'-'+i);
      return '<div class="substep '+(d?'done':'')+'" onclick="ckSS(\''+t.id+'\','+i+')"><div class="ss-ck">\u2713</div><div class="ss-name">'+esc(s)+'</div><div class="ss-pt">step'+(i+1)+'</div></div>';
    }).join('')+'</div>':''}`:'';
  return `<div class="task-card"><div class="task-card-inner">
    <div class="tc-emoji">${t.emoji}</div>
    <div class="tc-name">${esc(t.name)}</div>
    <div class="tc-meta"><span class="tag ${t.type==='duty'?'tag-duty':'tag-gold'}">${t.type==='duty'?'\u5206\u5185\u4E8B':'\u52A0\u5206\u9879'}</span></div>
    ${ptsHtml}${tmrHtml}${splitHtml}
    ${done?'<div style="color:var(--green);font-weight:800">\u2705 \u4ECA\u65E5\u5DF2\u5B8C\u6210</div>'
      :'<button class="btn btn-gold" style="min-width:170px" onclick="taskDone(\''+t.id+'\')">\u5B8C\u6210 \u00B7 \u5165\u8D26</button>'}
  </div></div>`;
}
function renderTasksE(){
  const u=DB.elder, list=u.tasks, d=doneToday('elder');
  if(tIdx>list.length-1)tIdx=Math.max(0,list.length-1);
  $('#scr-tasks').innerHTML=`
   <div class="topbar"><button class="back" onclick="goKid(KID)">\u2039</button><div class="tb-title">\u4ECA\u65E5\u4EFB\u52A1</div><div class="tb-right">${doneCount('elder')}/${list.length}</div></div>
   <div class="swipe-hint">\u4E00\u6B21\u53EA\u770B\u4E00\u4EF6 \u00B7 \u5DE6\u53F3\u6ED1\u52A8\u6362\u4EFB\u52A1</div>
   <div class="task-swipe-wrap" id="tsw"><div class="task-track" id="tTrack" style="transform:translateX(-${tIdx*100}%)">
     ${list.map(t=>taskCard(t,d.includes(t.id))).join('')}
   </div></div>
   <div class="swipe-dots">${list.map((_,i)=>'<i class="'+(i===tIdx?'on':'')+'"></i>').join('')}</div>
   ${doneCount('elder')>=list.length&&list.length?'<div class="streak-flame">\uD83C\uDF89 \u4ECA\u65E5\u5168\u90E8\u5B8C\u6210\uFF0C\u4F60\u8D62\u4E86\u4ECA\u5929\uFF01</div>':''}
   <div class="bag-corner bag-elder" onclick="openBag()">\uD83C\uDF92${u.bag.length?'<span class="bag-badge">'+u.bag.length+'</span>':''}</div>`;
  bindSwipe(list.length);
}
function bindSwipe(n){
  const w=$('#tsw'); if(!w)return;
  let sx=0,sy=0;
  w.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
  w.addEventListener('touchend',e=>{
    const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
    if(Math.abs(dx)>44&&Math.abs(dx)>Math.abs(dy)*1.2){
      tIdx=Math.max(0,Math.min(n-1,tIdx+(dx<0?1:-1)));
      applyIdx(); sPop();
    }
  },{passive:true});
}
function applyIdx(){
  const tr=$('#tTrack'); if(!tr)return;
  tr.style.transform='translateX(-'+(tIdx*100)+'%)';
  $$('#scr-tasks .swipe-dots i').forEach((el,i)=>el.classList.toggle('on',i===tIdx));
}
function taskDone(id){
  const t=DB.elder.tasks.find(x=>x.id===id); if(!t)return;
  const res=completeTask('elder',t);
  if(!res){ renderTasksE(); return; }
  sGood(); confetti(26);
  const got=(t.type==='duty')?('\u8D21\u732E\u503C +'+t.pts):('\u91D1\u5E01 +'+t.pts);
  modal(slip('\u5B58\u6B3E\u51ED\u6761',[
    ['\u6237\u540D',DB.elder.name],['\u4E1A\u52A1','\u4EFB\u52A1\u5165\u8D26'],['\u4E8B\u9879',t.name],['\u5165\u8D26',got],
    ['\u4F59\u989D',DB.elder.coins+' \u5E01 \u00B7 '+DB.elder.contrib+' \u8D21\u732E'],['\u65F6\u95F4',nowHM()]
  ],'\u5DF2\u5165\u8D26','green','\u5206\u5185\u4E8B\u6512\u8D21\u732E\uFF0C\u52A0\u5206\u4E8B\u8D5A\u91D1\u5E01\uFF0C\u90FD\u5728\u957F\u5927\u3002')+btnClose());
  renderTasksE();
}

/* ---- \u4E13\u6CE8\u8BA1\u65F6\u5668 ---- */
let tmr=null,tmrLeft=0,tmrTotal=0;
function tmrStart(sec){
  clearInterval(tmr);
  tmrTotal=sec; tmrLeft=sec; tmrPaint();
  tmr=setInterval(()=>{
    tmrLeft--;
    if(tmrLeft<=0){
      tmrLeft=0; clearInterval(tmr); sGood();
      const n=$('#tmrNum'); if(n)n.textContent='\u65F6\u95F4\u5230\uFF01';
      confetti(16); return;
    }
    tmrPaint();
  },1000);
  sPop();
}
function tmrPaint(){
  const f=$('#tmrFill'),n=$('#tmrNum');
  if(!f||!n)return;
  f.style.width=(tmrTotal?100*(tmrTotal-tmrLeft)/tmrTotal:0)+'%';
  if(tmrLeft>0)n.textContent=fmtT(tmrLeft);
}

/* ---- \u8001\u4E8C\uFF1A\u5730\u56FE + \u6311\u6218 ---- */
function mondayStr(){const d=new Date();const w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function dShift(ds,n){const p=ds.split('-').map(Number);const d=new Date(p[0],p[1]-1,p[2]+n);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function renderTasksY(){
  const u=DB.younger, d=doneToday('younger');
  let road='';
  for(let i=1;i<=10;i++){
    const past=i<=u.mapPos, gift=(i===5||i===10);
    road+='<div class="map-node '+(past?'past':'')+' '+(gift?'gift':'')+'"><div class="map-dot">'+(gift?'\uD83C\uDF81':(past?'\u2B50':i))+'</div></div>';
    if(i<10)road+='<div class="map-link '+(i<u.mapPos?'past':'')+'"></div>';
  }

   <div class="map-road"><div class="map-track">${road}</div><div class="map-horse" style="left:${14+u.mapPos*70}px">\uD83E\uDD8C</div></div>
   <div class="card">
     <div style="font-size:.8rem;font-weight:800;margin-bottom:6px">\uD83C\uDF08 \u4E00\u5468\u6311\u6218\uFF1A\u6BCF\u5929\u505A\u5B8C\u6240\u6709\u5206\u5185\u4E8B</div>
     <div class="chal-week">${chalDays.map(c=>'<i class="'+(c.on?'on':'')+'" style="'+(c.future?'opacity:.25':'')+'"></i>').join('')}</div>
     <div style="font-size:.68rem;color:var(--tx2);margin-top:6px">${chalDone>=7?'\uD83C\uDFC6 \u6311\u6218\u8FBE\u6210\uFF01\u627E\u7238\u5988\u9886\u7EC8\u6781\u5927\u5956':'\u672C\u5468 '+chalDone+'/7 \u5929 \u00B7 \u96C6\u6EE17\u5929\u6709\u5927\u793C'}</div>
   </div>
   ${u.tasks.map(t=>{const done=d.includes(t.id);
     const del=t.custom?'<div class="yt-del" onclick="delCustomTask(\''+t.id+'\')">\u2715</div>':'';
     return `<div class="yt-task ${done?'done':''}">
       <div class="yt-emoji">${t.emoji}</div>
       <div class="yt-info"><div class="yt-name">${esc(t.name)}</div>
         <div class="yt-meta"><span class="tag ${t.type==='duty'?'tag-duty':'tag-gold'}">${t.type==='duty'?'\u5206\u5185\u4E8B':'\u52A0\u5206\u9879'}</span><span class="yt-pts">\uD83E\uDE99+${t.pts}</span></div>
       </div>
       ${del}
       <button class="yt-done-btn" onclick="yDone(&quot;'+t.id+'&quot;)">'+(done?'\u2713':'\u5B8C\u6210')+'</button>
     </div>`;}).join('')}
   <div style="text-align:center;margin:14px 0 90px"><button class="btn btn-line" onclick="openCustomTask()">\u2795 \u6211\u8981\u52A0\u4E00\u4E2A\u4EFB\u52A1</button></div>
   <div class="bag-corner bag-younger" onclick="openBag()">\uD83C\uDF92${u.bag.length?'<span class="bag-badge">'+u.bag.length+'</span>':''}</div>`;
}
function yDone(id){
  const t=DB.younger.tasks.find(x=>x.id===id); if(!t)return;
  const res=completeTask('younger',t);
  if(!res){ renderTasksY(); return; }
  sGood(); confetti(20);
  modal(slip('\u5B58\u6B3E\u51ED\u6761',[
    ['\u6237\u540D',DB.younger.name],['\u4E8B\u9879',t.name],['\u5165\u8D26','\u91D1\u5E01 +'+t.pts],
    ['\u4F59\u989D',DB.younger.coins+' \u5E01'],['\u5C0F\u9E7F','\u524D\u8FDB 1 \u6B65']
  ],(res.gift?'\u6709\u5B9D\u7BB1':'\u5DF2\u5165\u8D26'),(res.gift?'pink':'green'),
    res.gift?'\u5B9D\u7BB1\u6253\u5F00\u83B7\u5F97\u76F2\u76D2\u5238\u00D71\uFF0C\u53BB\u76F2\u76D2\u9875\u6447\u793C\u7269\u5427\uFF01':'\u6512\u591F\u91D1\u5E01\u53EF\u4EE5\u53BB\u53D6\u6B3E\u67DC\u53F0\u6362\u771F\u94B1\u54E6\u3002')+btnClose());

}

/* ===================== \u81EA\u5B9A\u4EFB\u52A1\uFF08\u5B69\u5B50\u81EA\u52A9\u6DFB\u52A0\uFF09 ===================== */
const CT_EMOJIS=['\u2B50','\uD83C\uDFA8','\uD83C\uDFB9','\uD83E\uDE70','\uD83C\uDFF8','\uD83D\uDEB2','\uD83E\uDDC1','\uD83E\uDEB4','\uD83D\uDCDD','\uD83D\uDD24','\uD83E\uDDEE','\uD83D\uDC2C','\uD83C\uDF38','\uD83D\uDCA1','\uD83C\uDFC3','\uD83D\uDC26'];
var ctEmoji='\u2B50', ctType='gold', ctNameDraft='', ctPtsDraft='2', ctStepsDraft=['','',''];
function openCustomTask(){ ctEmoji='\u2B50'; ctType='gold'; ctNameDraft=''; ctPtsDraft='2'; ctStepsDraft=['','','']; renderCT(); }
function ctKeep(){

function ctPickE(e){ ctKeep(); ctEmoji=e; renderCT(); }
function ctPickT(t){ ctKeep(); ctType=t; renderCT(); }
function renderCT(){

   <div style="font-size:.68rem;color:var(--tx2);margin-top:10px">\u7C7B\u578B</div>

   <button class="btn btn-gold btn-block" style="margin-top:14px" onclick="addCustomTask()">\u5B58\u8FDB\u4EFB\u52A1\u6E05\u5355</button>

  setTimeout(()=>{const n=$('#ctName'); if(n&&n.value)n.setSelectionRange(n.value.length,n.value.length);},120);

function addCustomTask(){
  const nameEl=$('#ctName'), ptsEl=$('#ctPts');
  const name=(nameEl&&nameEl.value||'').trim();
  const pts=Math.max(1,Math.min(5,parseInt((ptsEl&&ptsEl.value)||'2',10)||2));
  const split=[0,1,2].map(i=>{const e=$('#ctStep'+i); return e?(e.value||'').trim():'';}).filter(Boolean);
  if(!name){ sBad(); alert('\u5148\u7ED9\u4EFB\u52A1\u8D77\u4E2A\u540D\u5B57\u5427'); return; }
  DB.younger.tasks.push({id:'c'+Date.now(),emoji:ctEmoji,name:name,type:ctType,pts:pts,split:split,custom:true});
  save(); sPop(); closeModal();
  modal(slip('\u65B0\u4EFB\u52A1\u4E0A\u67B6',[
    ['\u4EFB\u52A1',name],['\u56FE\u6848',ctEmoji],['\u7C7B\u578B',ctType==='duty'?'\u5206\u5185\u4E8B':'\u52A0\u5206\u9879'],
    ['\u5C0F\u6B65\u9AA4',split.length?split.length+' \u6B65':'\u672A\u62C6\u5206'],['\u916C\u52B3','\u91D1\u5E01 +'+pts+' / \u6B21']
  ],'\u5DF2\u4E0A\u67B6','pink',split.length?'\u5927\u4EFB\u52A1\u62C6\u6210\u5C0F\u6B65\uFF0C\u505A\u5B8C\u4E00\u6B65\u52FE\u4E00\u6B65\uFF0C\u96BE\u5EA6\u7ACB\u523B\u4E0B\u964D\u3002':'\u81EA\u5DF1\u5B9A\u7684\u76EE\u6807\uFF0C\u505A\u5B8C\u6700\u9177\u3002')+btnClose('\u5F00\u59CB\u8D5A\u91D1\u5E01'));
  renderTasksY();
}
function delCustomTask(id){
  const t=DB.younger.tasks.find(x=>x.id===id); if(!t||!t.custom)return;
  if(!confirm('\u5220\u6389\u300C'+t.name+'\u300D\uFF1F'))return;
  DB.younger.tasks=DB.younger.tasks.filter(x=>x.id!==id);
  const ts=todayStr();
  if(DB.elder.done[ts]) DB.elder.done[ts]=DB.elder.done[ts].filter(x=>x!==id);
  save(); renderTasksY();
}

  const k=KID,u=DB[k],S=DB.settings;
  const hiFri=(k==='younger'&&S.friday&&isFriday());

   ${hiFri?'<div class="friday-banner">\uD83C\uDF89 \u4ECA\u65E5\u5468\u4E94\u9AD8\u606F\u65E5 \u00B7 '+rate+' \u5E01 = 1 \u5143</div>':''}
   <div class="counter-visual">
     <div style="font-size:.85rem;opacity:.92">\u8BF7\u9009\u62E9\u53D6\u6B3E\u91D1\u989D</div>
     <div class="counter-window" id="cw"><div class="cw-glove">\uD83D\uDC50</div></div>
     <div class="counter-note">${hiFri?'\u5468\u4E94\u7279\u60E0\uFF1A\u4ECA\u5929\u6BCF 1 \u5143\u5C11\u4ED8 2 \u5E01\uFF01':'\u4ECA\u65E5\u6C47\u7387\uFF1A\u6BCF '+rate+' \u5E01\u5151\u6362 1 \u5143'}</div>

   <div class="empty-tip" style="font-size:.72rem">\u53D6\u6B3E\u9700\u884C\u957F\uFF08\u5BB6\u957F\uFF09\u6279\u51C6 \u00B7 \u6279\u51C6\u540E\u627E\u7238\u5988\u62FF\u771F\u94B1</div>`;

function pickCash(v,need){

  const cw=$('#cw'); if(cw)cw.classList.add('open');
  sDing();
  modal('<div style="text-align:center;font-size:2.2rem">\uD83E\uDDFE</div><div style="text-align:center;font-weight:800;margin:4px 0 2px">\u786E\u8BA4\u9012\u4EA4\u53D6\u6B3E\u7533\u8BF7\uFF1F</div>'
   +slip('\u53D6\u6B3E\u7533\u8BF7',[['\u6237\u540D',u.name],['\u53D6\u6B3E',v+' \u5143'],['\u652F\u4ED8',need+' \u91D1\u5E01'],['\u6E20\u9053','\u884C\u957F\u5BA1\u6279 \u00B7 \u7238\u5988\u73B0\u91D1\u652F\u4ED8']],'\u5F85\u6279\u51C6','pink','\u6279\u51C6\u524D\u91D1\u5E01\u5148\u51BB\u7ED3\uFF0C\u4E0D\u6279\u51C6\u4F1A\u81EA\u52A8\u9000\u56DE\u3002')
   +'<div style="display:flex;gap:10px;margin-top:6px">'

   +'<button class="btn btn-gold" style="flex:1" onclick="submitWithdraw('+v+','+need+')">\u9012\u4EA4\u7533\u8BF7</button></div>');
}
function submitWithdraw(v,need){
  const k=KID,u=DB[k];
  if(u.coins<need){ sBad(); closeModal(); return; }
  u.coins-=need;
  addFlow(k,'-',need,'\u7533\u8BF7\u53D6\u6B3E '+v+' \u5143\uFF08\u51BB\u7ED3\uFF09');
  DB.reviews.unshift({id:uid(),kid:k,type:'withdraw',amount:v,coins:need,status:'pending',time:todayStr()+' '+nowHM()});
  notice(u.name+' \u7533\u8BF7\u53D6\u6B3E '+v+' \u5143\uFF08\u51BB\u7ED3 '+need+' \u5E01\uFF09');
  save(); sPop(); closeModal();
  modal(slip('\u53D7\u7406\u56DE\u6267',[['\u4E1A\u52A1','\u53D6\u6B3E\u7533\u8BF7'],['\u72B6\u6001','\u5DF2\u9012\u4EA4\u884C\u957F'],['\u540E\u7EED','\u6279\u51C6\u540E\u51ED\u6761\u5151\u73B0']],'\u5DF2\u53D7\u7406','','\u628A\u8FD9\u5F20\u56DE\u6267\u6536\u597D\uFF0C\u6279\u51C6\u540E\u62FF\u5B83\u6362\u771F\u94B1\u3002')
   +'<button class="btn btn-gold btn-block" style="margin-top:8px" onclick="closeModal();renderWithdraw()">\u77E5\u9053\u5566</button>');
  renderWithdraw();
}

/* ===================== \u76F2\u76D2 ===================== */
let boxEnergy=0,boxBusy=false,motionOn=false;
function openBox(){ boxEnergy=0; boxBusy=false; renderBox(); go('box'); }
function renderBox(){
  const k=KID,u=DB[k],S=DB.settings;
  const free=u.boxTickets>0;
  $('#scr-box').innerHTML=`
   <div class="topbar"><button class="back" onclick="goKid(KID)">\u2039</button><div class="tb-title">\u795E\u79D8\u76F2\u76D2</div><div class="tb-right">\uD83C\uDF9F\uFE0F \u5238 \u00D7${u.boxTickets}</div></div>
   <div class="box-stage">
     <div class="box-visual bx-${k}" id="boxV">\uD83C\uDF81</div>
     <div class="shake-tip">${free?'\u4F60\u6709\u514D\u8D39\u76F2\u76D2\u5238 \u00D7'+u.boxTickets+' \u00B7 \u6309\u4F4F\u76D2\u5B50\u7528\u529B\u6447':'\u6309\u4F4F\u76D2\u5B50\u5DE6\u53F3\u7528\u529B\u6447\uFF0C\u6216\u7529\u52A8\u624B\u673A'}</div>
     <div class="shake-bar ice-progress"><div class="bar"><div class="fill" id="boxFill"></div></div><div class="txt" id="boxTxt">${free?'\u672C\u6B21\u514D\u8D39\uFF08\u7528\u5238 1 \u5F20\uFF09':'\u6D88\u8017 '+S.boxCost+' \u91D1\u5E01/\u6B21'} \u00B7 \u4F59\u989D ${u.coins} \u5E01</div></div>
     <button class="btn btn-line" style="margin-top:14px" onclick="reqMotion()">\uD83D\uDCF1 \u5F00\u542F\u624B\u673A\u7529\u4E00\u7529</button>
   </div>`;
  bindBox();
}
function bindBox(){
  const b=$('#boxV'); if(!b)return;
  let lx=0,ly=0,down=false;
  b.addEventListener('pointerdown',e=>{down=true;lx=e.clientX;ly=e.clientY;b.classList.add('shaking');});
  b.addEventListener('pointermove',e=>{
    if(!down||boxBusy)return;
    boxEnergy+=Math.abs(e.clientX-lx)+Math.abs(e.clientY-ly);
    lx=e.clientX; ly=e.clientY; boxPaint();
  });
  const up=()=>{down=false;b.classList.remove('shaking');};
  b.addEventListener('pointerup',up);
  b.addEventListener('pointercancel',up);
}
function boxPaint(){
  const p=Math.min(100,boxEnergy/6);
  const f=$('#boxFill'); if(f)f.style.width=p+'%';
  if(p>=14&&p<22)sTick();
  if(p>=100&&!boxBusy){ boxBusy=true; boxOpen(); }
}
function reqMotion(){
  if(motionOn){ sPop(); return; }
  const bind=()=>{
    window.addEventListener('devicemotion',e=>{
      const a=e.accelerationIncludingGravity;
      const boxScr=document.getElementById('scr-box');
      if(!a||!boxScr||!boxScr.classList.contains('active'))return;
      const m=Math.abs(a.x||0)+Math.abs(a.y||0)+Math.abs(a.z||0);
      if(m>22){
        boxEnergy+=m*1.2;
        const b=$('#boxV');
        if(b){b.classList.add('shaking');clearTimeout(b._st);b._st=setTimeout(()=>{if(b)b.classList.remove('shaking');},300);}
        boxPaint();
      }
    });
    motionOn=true;
    modal('<div style="text-align:center;padding:10px">\u2705 \u7529\u4E00\u7529\u5DF2\u5F00\u542F<br><span style="font-size:.75rem;color:var(--tx2)">\u7528\u529B\u7529\u52A8\u624B\u673A\u5373\u53EF\u6447\u76D2</span></div>'+btnClose('\u597D\u7684'));
  };
  if(typeof DeviceMotionEvent!=='undefined'&&typeof DeviceMotionEvent.requestPermission==='function'){
    DeviceMotionEvent.requestPermission().then(r=>{
      if(r==='granted')bind();
      else modal('<div style="text-align:center;padding:10px">\u26A0\uFE0F \u672A\u83B7\u5F97\u52A8\u4F5C\u6743\u9650<br><span style="font-size:.75rem;color:var(--tx2)">\u4ECD\u53EF\u6309\u4F4F\u76D2\u5B50\u5DE6\u53F3\u6ED1\u52A8\u6447</span></div>'+btnClose());
    }).catch(()=>{});
  }else bind();
}
function boxOpen(){
  const k=KID,u=DB[k],S=DB.settings;
  const b=$('#boxV');
  if(b){b.classList.remove('shaking');b.classList.add('cracking');}
  if(u.boxTickets<=0&&u.coins<S.boxCost){ boxBusy=false; boxEnergy=0; renderBox(); return; }
  sDing();
  const pool=(k==='elder')?BOX_Elder:BOX_Younger;
  const p=pool[Math.floor(Math.random()*pool.length)];
  const useTicket=u.boxTickets>0;
  if(useTicket)u.boxTickets--;
  else{ u.coins-=S.boxCost; addFlow(k,'-',S.boxCost,'\u8D2D\u4E70\u76F2\u76D2'); }
  DB.reviews.unshift({id:uid(),kid:k,type:'box',prize:{e:p.e,n:p.n},status:'pending',time:todayStr()+' '+nowHM()});
  addFlow(k,'+',0,'\u6447\u51FA\u300C'+p.n+'\u300D\u5F85\u884C\u957F\u786E\u8BA4');
  notice(u.name+' \u6447\u51FA\u76F2\u76D2\uFF1A'+p.n+'\uFF08\u5F85\u786E\u8BA4\u53D1\u653E\uFF09');
  save();
  setTimeout(()=>{
    confetti(36); sGood();

     +slip('\u76F2\u76D2\u51ED\u6761',[['\u6237\u540D',u.name],['\u652F\u4ED8',useTicket?'\u514D\u8D39\u76F2\u76D2\u5238':(S.boxCost+' \u91D1\u5E01')],['\u5956\u54C1',p.n]],'\u5F85\u53D1\u653E','pink')

function flipCard(p,isPriv){
  return `<div class="flip-card" onclick="this.classList.toggle('flipped')">
    <div class="flip-inner">
      <div class="flip-face flip-front">
        <div class="bag-item-name">${p.emoji} ${esc(p.name)}</div>
        <div class="bag-item-foot"><span class="tiny">${isPriv?'\u70B9\u51FB\u7FFB\u9762\u67E5\u770B':'\u83B7\u5F97\u4E8E '+esc(p.got||'')}</span><span class="tiny">\uD83D\uDC49</span></div>
      </div>
      <div class="flip-face flip-back">
        <div class="bag-item-desc">${esc(p.desc||'')}</div>
        <div class="bag-item-foot">
          <span class="tiny">${isPriv?'\u7279\u6743\u5361':'\u627E\u7238\u5988\u5151\u73B0'}</span>
          ${isPriv&&p.use==='child'?'<button class="btn btn-red-line" style="min-height:34px;font-size:.72rem" onclick="event.stopPropagation();usePriv(\''+p.id+'\')">\u4F7F\u7528</button>':'<span class="tiny">\u2705</span>'}
        </div>
      </div>
    </div></div>`;
}
function renderBag(){
  const k=KID,u=DB[k];
  const privs=u.bag.filter(i=>i.type==='priv');
  const prizes=u.bag.filter(i=>i.type==='prize');
  const tabs=['\uD83D\uDEE1\uFE0F \u7279\u6743 '+privs.length,'\uD83C\uDFC6 \u5956\u54C1 '+prizes.length,'\uD83D\uDED2 \u5546\u5E97'];
  let body='';
  if(bagTab===0){
    body=privs.length?privs.map(p=>flipCard(p,true)).join(''):'<div class="empty-tip">\u8FD8\u6CA1\u6709\u7279\u6743\u5361</div>';
  }else if(bagTab===1){
    body=prizes.length?prizes.map(p=>flipCard(p,false)).join(''):'<div class="empty-tip">\u80CC\u5305\u7A7A\u7A7A\u7684\uFF0C\u53BB\u8D5A\u94B1\u6362\u5956\u54C1\u5427</div>';
  }else{
    body='<div class="card" style="text-align:center">\uD83C\uDF9F\uFE0F \u76F2\u76D2\u5238\u4F59\u989D <b style="font-size:1.3rem;color:var(--acc2)">\u00D7'+u.boxTickets+'</b>'
     +'<div style="font-size:.7rem;color:var(--tx2);margin-top:4px">\u5C0F\u9E7F\u5730\u56FE\u5F00\u5B9D\u7BB1 / \u6447\u4E00\u6447\u65F6\u53EF\u62B5\u6263</div></div>'
     +'<div class="empty-tip" style="padding:0 0 10px;font-size:.7rem;text-align:left">\u6BCF\u9879\u5956\u52B1\u90FD\u5199\u660E\u4E86\u65F6\u957F\u3001\u6B21\u6570\u548C\u7528\u6CD5\uFF0C\u5151\u6362\u540E\u6309\u4E0A\u9762\u5199\u7684\u6267\u884C\u3002</div>'
     +u.rewards.map(r=>{
       const ok=u.coins>=r.cost;
       const q=rewardQuota(k,r);
       const canUse=q.left>0;
       const btnCls=(ok&&canUse)?'btn-gold':'btn-gray';
       const btnTxt=!canUse?(limitLabel(r)+'\u7528\u5B8C'):(ok?'\u5151\u6362':'\u4E0D\u591F');
       return '<div class="task-edit-row" style="align-items:flex-start"><div class="te-name">'
         +'<div>'+r.emoji+' '+esc(r.name)+(r.limit?('<span class="rw-badge">'+limitLabel(r)+' '+q.used+'/'+q.max+'</span>'):'')+'</div>'
         +(r.rule?'<div class="rw-rule">\u89C4\u5219\uFF1A'+esc(r.rule)+'</div>':'')
         +'</div><div class="te-pts">'+r.cost+'\u5E01</div>'
         +'<button class="btn '+btnCls+'" style="min-height:38px;font-size:.75rem"'+(ok&&canUse?'':' disabled style="opacity:.4"')+' onclick="exchange(\''+r.id+'\')">'+btnTxt+'</button></div>';
     }).join('');
  }
  $('#scr-backpack').innerHTML=`
   <div class="topbar"><button class="back" onclick="goKid(KID)">\u2039</button><div class="tb-title">\u6211\u7684\u80CC\u5305</div><div class="tb-right">\uD83E\uDE99 ${u.coins}</div></div>
   <div class="bag-tabs">${tabs.map((t,i)=>'<button class="'+(i===bagTab?'on':'')+'" onclick="bagTab='+i+';renderBag()">'+t+'</button>').join('')}</div>

function usePriv(id){
  const k=KID,u=DB[k];
  const i=u.bag.findIndex(x=>x.id===id); if(i<0)return;
  const p=u.bag[i];
  u.bag.splice(i,1);
  notice(u.name+' \u4F7F\u7528\u4E86\u7279\u6743\u5361\u300C'+p.name+'\u300D',true);
  addFlow(k,'+',0,'\u4F7F\u7528\u7279\u6743\u300C'+p.name+'\u300D');
  save(); sPop();
  modal(slip('\u7279\u6743\u4F7F\u7528',[['\u5361\u7247',p.name],['\u8BF4\u660E',p.desc||''],['\u72B6\u6001','\u5DF2\u51FA\u793A\u7ED9\u5BB6\u957F']],'\u5DF2\u51FA\u793A','','\u5BB6\u957F\u770B\u5230\u8BF7\u6309\u89C4\u5219\u914D\u5408\u6267\u884C\u3002')+btnClose('\u5DF2\u51FA\u793A'));
  renderBag();
}
/* ---- \u5956\u52B1\u6B21\u6570\u9650\u989D\uFF1Aweek=\u81EA\u7136\u5468(\u5468\u4E00~\u5468\u65E5)\uFF0Cmonth=\u81EA\u7136\u6708 ---- */
function periodKey(limit){
  if(limit==='month'){ const d=new Date(); return 'M'+d.getFullYear()+'-'+pad(d.getMonth()+1); }
  return 'W'+mondayStr();
}
function rewardQuota(k,r){
  const max=r.max||1;
  if(!r.limit)return {used:0,max:max,left:max};
  const u=DB[k]; u.rwUse=u.rwUse||{};
  const used=u.rwUse[r.id+'_'+periodKey(r.limit)]||0;
  return {used:used,max:max,left:Math.max(0,max-used)};
}
function limitLabel(r){ return r.limit==='month'?'\u672C\u6708':'\u672C\u5468'; }
function exchange(rid){
  const k=KID,u=DB[k];
  const r=u.rewards.find(x=>x.id===rid); if(!r)return;
  if(u.coins<r.cost){ sBad(); return; }
  const q=rewardQuota(k,r);
  if(q.left<=0){ sBad(); modal('<div style="text-align:center;padding:8px;line-height:1.7"><div style="font-size:2rem">\u23F3</div><b>'+esc(r.name)+'</b><br><span style="font-size:.8rem;color:var(--tx2)">'+limitLabel(r)+'\u5DF2\u7ECF\u7528\u6EE1\u4E86\uFF08'+q.used+'/'+q.max+'\uFF09<br>'+limitLabel(r)+'\u4E4B\u540E\u518D\u6765\uFF0C\u91D1\u5E01\u4F1A\u4E00\u76F4\u5728\u3002</span></div>'+btnClose('\u77E5\u9053\u4E86')); return; }
  u.coins-=r.cost;
  addFlow(k,'-',r.cost,'\u5151\u6362\u300C'+r.name+'\u300D');
  u.rwUse=u.rwUse||{};
  const pk=r.id+'_'+periodKey(r.limit||'week');
  if(r.limit)u.rwUse[pk]=(u.rwUse[pk]||0)+1;
  u.bag.push({id:uid(),emoji:r.emoji,name:r.name,desc:(r.rule||'\u5DF2\u5151\u6362\u5956\u52B1')+' \u00B7 \u627E\u7238\u5988\u5151\u73B0',type:'prize',got:todayStr()});
  notice(u.name+' \u5151\u6362\u4E86\u300C'+r.name+'\u300D\uFF08-'+r.cost+'\u5E01\uFF09');
  save(); sGood(); confetti(24);
  modal(slip('\u5151\u6362\u51ED\u6761',[['\u6237\u540D',u.name],['\u5956\u54C1',r.name],['\u652F\u4ED8',r.cost+' \u91D1\u5E01'],['\u4F59\u989D',u.coins+' \u5E01'],
    ['\u672C\u6B21\u89C4\u5219',r.rule||'\u6309\u7EA6\u5B9A\u6267\u884C']],'\u5DF2\u5151\u6362','green',r.limit?('\u8FD9\u5F20\u51ED\u6761\u53EA\u80FD\u6309\u4E0A\u9762\u5199\u7684\u5185\u5BB9\u7528\u4E00\u6B21\uFF0C'+(r.limit==='month'?'\u672C\u6708':'\u672C\u5468')+'\u8FD8\u5269 '+(q.left-1)+' \u6B21\u3002'):'\u62FF\u8FD9\u5F20\u51ED\u6761\u627E\u7238\u5988\u5151\u73B0\u5956\u52B1\u3002')+btnClose('\u53BB\u5151\u73B0'));
  renderBag();
}

function pwdDotsRender(){

function pwdKey(n){

}
function pwdClear(){ pwdIn=''; pwdDotsRender(); }

    sGood(); pwdIn=''; renderParent(0); go('parent');

    sBad();
    const e=$('#pwdErr'); if(e)e.textContent='\u5BC6\u7801\u4E0D\u5BF9\uFF0C\u518D\u8BD5\u8BD5';
    pwdIn=''; pwdDotsRender();

}

         +(r.rule?'<div class="rw-rule">'+esc(r.rule)+'</div>':'')
         +'</div><div class="te-pts">'+r.cost+'\u5E01</div>'
         +'<button class="btn btn-gray" style="min-height:32px;font-size:.7rem" onclick="delReward(\''+k+'\',\''+r.id+'\')">\u5220\u9664</button></div>';}).join('')
       +'<span class="mini-label" style="margin-top:6px">\uFF0B \u52A0\u4E00\u4E2A\u5956\u52B1</span>'
       +'<div class="form-row"><input class="mini-input" id="rw-em-'+k+'" value="\uD83C\uDF81" style="flex:0 0 72px"><input class="mini-input" id="rw-nm-'+k+'" placeholder="\u5956\u52B1\u540D\uFF0C\u5982\uFF1A\u5468\u672B\u53BB\u516C\u56ED1\u6B21"></div>'
       +'<div class="form-row"><input class="mini-input" id="rw-cs-'+k+'" type="number" placeholder="\u4EF7\u683C\uFF08\u91D1\u5E01\uFF09" min="1">'
       +'<select class="mini-input" id="rw-lm-'+k+'"><option value="week">\u6BCF\u5468</option><option value="month">\u6BCF\u6708</option><option value="none">\u4E0D\u9650</option></select>'
       +'<input class="mini-input" id="rw-mx-'+k+'" type="number" placeholder="\u6B21\u6570" min="1" value="1" style="flex:0 0 80px"></div>'
       +'<textarea class="mini-input" id="rw-rl-'+k+'" rows="2" placeholder="\u7528\u6CD5\u89C4\u5219\uFF08\u5FC5\u586B\uFF0C\u8D8A\u5177\u4F53\u8D8A\u597D\uFF09&#10;\u4F8B\uFF1A\u5468\u672B\u4EFB\u4E00\u5929\uFF0C\u73A930\u5206\u949F\uFF0C\u8BA1\u65F6\u5668\u54CD\u5C31\u505C\uFF0C\u4E0D\u80FD\u6362\u522B\u7684" style="resize:none"></textarea>'
       +'<button class="btn btn-gold btn-block" onclick="addReward(\''+k+'\')">\uFF0B \u6DFB\u52A0\u5956\u52B1</button></div>';
    }).join('');
  }else{
    body='<div class="card">'
     +'<span class="mini-label">\u5B69\u5B50\u6635\u79F0</span>'
     +'<div class="form-row"><input class="mini-input" id="st-nm-younger" value="'+esc(y.name)+'" placeholder="\u661F\u661F" style="flex:1"></div>'
     +'<span class="mini-label">\u7BA1\u7406\u5BC6\u7801\uFF084\u4F4D\u6570\u5B57\uFF09</span>'
     +'<input class="mini-input" id="st-pwd" value="'+esc(S.pwd)+'" inputmode="numeric" maxlength="4">'
     +'<div class="form-row"><div class="fr"><span class="mini-label">\u6C47\u7387\uFF08\u5E01 = 1\u5143\uFF09</span><input class="mini-input" id="st-rate" type="number" value="'+S.rate+'"></div>'
     +'<div class="fr"><span class="mini-label">\u76F2\u76D2\u4EF7\u683C\uFF08\u5E01\uFF09</span><input class="mini-input" id="st-box" type="number" value="'+S.boxCost+'"></div></div>'
     +'<div class="switch-row"><div><div class="sw-name">'+esc(y.name)+'\u5468\u4E94\u9AD8\u606F</div><div class="sw-desc">\u5468\u4E94\u53D6\u6B3E\u6BCF 1 \u5143\u5C11\u4ED8 2 \u5E01</div></div>'
     +'<div class="sw-toggle '+(S.friday?'on':'')+'" onclick="DB.settings.friday=!DB.settings.friday;save();renderParent(3)"></div></div>'
     +'<button class="btn btn-gold btn-block" onclick="saveSettings()">\u4FDD\u5B58\u8BBE\u7F6E</button></div>'
     +'<div class="card"><span class="mini-label" style="color:var(--red)">\u5371\u9669\u533A</span>'
     +'<button class="btn btn-red-line btn-block" onclick="askReset()">\uD83D\uDDD1 \u6E05\u7A7A\u5168\u90E8\u6570\u636E</button>'
     +'<div style="font-size:.68rem;color:var(--tx2);margin-top:8px">\u6570\u636E\u4EC5\u4FDD\u5B58\u5728\u672C\u673A\u6D4F\u89C8\u5668 localStorage\uFF0C\u6362\u8BBE\u5907/\u6E05\u7F13\u5B58\u4F1A\u4E22\u5931</div></div>';
  }
  $('#scr-parent').innerHTML=`
   <div class="topbar"><button class="back" onclick="goLogin()">\u2039</button><div class="tb-title">\uD83C\uDFE6 \u884C\u957F\u529E\u516C\u5BA4</div><div class="tb-right">${fmtD(todayStr())}</div></div>
   <div class="ptabs">${tabs.map((t,i)=>'<button class="'+(i===tab?'on':'')+'" onclick="renderParent('+i+')">'+t+(i===1&&pend?'<span class="reddot">'+pend+'</span>':'')+'</button>').join('')}</div>
   ${body}<div style="height:30px"></div>`;
}
function toggleHot(){
  const e=DB.elder;
  e.hot=(e.hot===todayStr())?null:todayStr();
  save(); sPop(); renderParent(0);
}
function addTask(k){
  const em=($('#tk-em-'+k).value||'\u2B50').trim();
  const nm=($('#tk-nm-'+k).value||'').trim();
  const tp=$('#tk-tp-'+k).value;
  const pt=Math.max(1,Math.min(9,parseInt($('#tk-pt-'+k).value)||1));
  const sp=($('#tk-sp-'+k).value||'').split('\n').map(s=>s.trim()).filter(Boolean);
  if(!nm){ sBad(); return; }
  DB[k].tasks.push({id:uid(),emoji:em,name:nm,type:tp,pts:pt,split:sp});
  save(); sPop(); renderParent(2);
}
function delTask(k,id){
  DB[k].tasks=DB[k].tasks.filter(t=>t.id!==id);
  save(); sPop(); renderParent(2);
}
function addReward(k){
  const em=($('#rw-em-'+k).value||'\uD83C\uDF81').trim();
  const nm=($('#rw-nm-'+k).value||'').trim();
  const cs=Math.max(1,parseInt($('#rw-cs-'+k).value)||5);
  const lm=$('#rw-lm-'+k).value;
  const mx=Math.max(1,Math.min(30,parseInt($('#rw-mx-'+k).value)||1));
  const rl=($('#rw-rl-'+k).value||'').trim();
  if(!nm){ sBad(); return; }
  if(!rl){ sBad(); alert('\u8BF7\u5199\u6E05\u7528\u6CD5\u89C4\u5219\uFF1A\u591A\u4E45\u3001\u51E0\u6B21\u3001\u80FD\u4E0D\u80FD\u6362\u522B\u7684\u3002\u5199\u5177\u4F53\u7684\u5956\u52B1\u624D\u4E0D\u5BB9\u6613\u88AB\u94BB\u7A7A\u5B50\u3002'); return; }
  DB[k].rewards.push({id:uid(),emoji:em,name:nm,cost:cs,limit:lm==='none'?'':lm,max:mx,rule:rl});
  save(); sPop(); renderParent(2);
}
function delReward(k,id){
  DB[k].rewards=DB[k].rewards.filter(r=>r.id!==id);
  save(); sPop(); renderParent(2);
}
function reviewAct(id,ok){
  const r=DB.reviews.find(x=>x.id===id);
  if(!r||r.status!=='pending')return;
  r.status=ok?'ok':'no';
  if(r.type==='withdraw'){
    if(ok){ addFlow(r.kid,'+',0,'\u53D6\u6B3E '+r.amount+' \u5143\u5DF2\u6279\u51C6 \u00B7 \u5BB6\u957F\u652F\u4ED8\u73B0\u91D1'); notice('\u5DF2\u6279\u51C6 '+DB[r.kid].name+' \u53D6\u6B3E '+r.amount+' \u5143\uFF0C\u8BF7\u652F\u4ED8\u73B0\u91D1'); }
    else{ DB[r.kid].coins+=r.coins; addFlow(r.kid,'+',r.coins,'\u53D6\u6B3E\u88AB\u9000\u56DE \u00B7 \u91D1\u5E01\u89E3\u51BB'); notice('\u9000\u56DE\u4E86 '+DB[r.kid].name+' \u7684\u53D6\u6B3E\u7533\u8BF7'); }
  }else if(r.type==='box'){
    if(ok){
      DB[r.kid].bag.push({id:uid(),emoji:r.prize.e,name:r.prize.n,desc:'\u76F2\u76D2\u5956\u54C1 \u00B7 \u627E\u7238\u5988\u5151\u73B0',type:'prize',got:todayStr()});
      notice('\u5DF2\u53D1\u653E\u76F2\u76D2\u5956\u54C1\u300C'+r.prize.n+'\u300D\u7ED9 '+DB[r.kid].name);
    }else{ addFlow(r.kid,'+',0,'\u76F2\u76D2\u300C'+r.prize.n+'\u300D\u672A\u53D1\u653E'); notice('\u672A\u53D1\u653E '+DB[r.kid].name+' \u7684\u76F2\u76D2\u5956\u54C1'); }
  }
  save(); ok?sGood():sBad(); renderParent(1);
}
function saveSettings(){
  const S=DB.settings;
  const nmY=($('#st-nm-younger').value||'').trim();
  if(nmY)DB.younger.name=nmY.slice(0,8);
  const p=($('#st-pwd').value||'').trim();
  if(/^\d{4}$/.test(p))S.pwd=p;
  S.rate=Math.max(2,Math.min(50,parseInt($('#st-rate').value)||10));
  S.boxCost=Math.max(1,Math.min(99,parseInt($('#st-box').value)||10));
  save(); sPop(); renderParent(3);
  modal('<div style="text-align:center;padding:10px">\u2705 \u8BBE\u7F6E\u5DF2\u4FDD\u5B58</div>'+btnClose('\u597D'));
}
function askReset(){
  modal('<div style="text-align:center;font-weight:800;margin-bottom:8px">\u26A0\uFE0F \u6E05\u7A7A\u5168\u90E8\u6570\u636E\uFF1F</div>'
   +'<div style="font-size:.8rem;color:var(--tx2);line-height:1.6">\u91D1\u5E01\u3001\u4EFB\u52A1\u3001\u6D41\u6C34\u3001\u80CC\u5305\u5168\u90E8\u5F52\u96F6\uFF0C\u65E0\u6CD5\u6062\u590D\u3002</div>'
   +'<div style="display:flex;gap:10px;margin-top:12px">'
   +'<button class="btn btn-gray" style="flex:1" onclick="closeModal()">\u53D6\u6D88</button>'
   +'<button class="btn btn-red-line" style="flex:1" onclick="doReset()">\u786E\u8BA4\u6E05\u7A7A</button></div>');
}
function doReset(){
  try{ localStorage.removeItem(KEY); }catch(e){}
  closeModal(); loadDB(); sBad(); renderParent(0);
}

/* ===================== \u521D\u59CB\u5316 ===================== */
$('#modalLayer').addEventListener('click',e=>{ if(e.target.id==='modalLayer')closeModal(); });
document.addEventListener('pointerdown',()=>ac(),{once:true});
document.addEventListener('visibilitychange',()=>{ if(document.hidden)clearAllTimers(); });
loadDB();
goLogin();

/* ===================== URL \u76F4\u8FBE\uFF08\u6536\u85CF/\u4E3B\u5C4F\u5E55\u6DF1\u94FE\uFF09 =====================
   ?go=younger|tasks|withdraw|box|bag|flow|pwd|parent
   ?p=\u7BA1\u7406\u5BC6\u7801\uFF08go=parent \u65F6\u5FC5\u987B\u643A\u5E26\uFF0C\u4E0D\u8BBE\u540E\u95E8\uFF09 */
(function(){
  try{
    const q=new URLSearchParams(location.search);
    const g=q.get('go');
    if(!g)return;
    const k='younger';
    if(g==='elder')goKid('younger');
    else if(g==='younger')goKid('younger');
    else if(g==='tasks'){ goKid(k); openTasks(); }
    else if(g==='withdraw'){ goKid(k); openWithdraw(); }
    else if(g==='box'){ goKid(k); openBox(); }
    else if(g==='bag'){ goKid(k); openBag(); }
    else if(g==='flow'){ openFlow(k); }
    else if(g==='pwd'){ applyTheme(); document.body.id=''; renderPwd(); go('pwd'); }
    else if(g==='parent'&&q.get('p')===DB.settings.pwd){ applyTheme(); document.body.id=''; renderParent(0); go('parent'); }
  }catch(e){}
})();
</script>
</body>
</html>
