<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d1626">
<title>成长银行 · 家庭行为银行</title>
<style>
/* ============ 基础 ============ */
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html { font-size:16px; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  min-height:100vh; overflow-x:hidden;
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
button { font-family:inherit; border:none; background:none; cursor:pointer; }
input, select, textarea { font-family:inherit; }
.mono { font-family:"SF Mono","Courier New",monospace; }

/* ============ 主题变量 ============ */
.theme-elder {
  --bg:#0d1626; --bg2:#13203a; --card:#16233f; --card2:#1b2c4e;
  --tx:#e8e4d8; --tx2:#8fa0bd; --line:#243455;
  --acc:#f0c75e; --acc2:#d4af37; --accT:#2a2008;
  --green:#5ec97c; --red:#e86a6a; --blue:#6aa8e8;
  --winBg:#0b1220; --winTx:#f5dfa0;
}
.theme-younger {
  --bg:#fff0f6; --bg2:#ffdff0; --card:#ffffff; --card2:#fff5fa;
  --tx:#63303f; --tx2:#b07890; --line:#ffd0e2;
  --acc:#ff7fb0; --acc2:#e8568f; --accT:#fff;
  --green:#58c48a; --red:#f27d9d; --blue:#7db8f0;
  --winBg:#fff; --winTx:#e8568f;
}
.theme-parent {
  --bg:#f4f1ea; --bg2:#ece7dc; --card:#ffffff; --card2:#faf7f0;
  --tx:#3f3a30; --tx2:#918a7a; --line:#e2dccc;
  --acc:#b8923f; --acc2:#97772e; --accT:#fff;
  --green:#5aa06e; --red:#cc5f5f; --blue:#5f8fc4;
  --winBg:#faf7f0; --winTx:#3f3a30;
}

body.theme-elder { background:linear-gradient(180deg,var(--bg),var(--bg2)); color:var(--tx); }
body.theme-younger { background:linear-gradient(180deg,var(--bg),var(--bg2)); color:var(--tx); }
body.theme-parent { background:var(--bg); color:var(--tx); }

/* ============ 换肤系统：五色系调色板 ============ */
body.palette-pure {
  --bg:#fafafa; --bg2:#f2f2f2; --card:#ffffff; --card2:#f8f8f8;
  --tx:#333333; --tx2:#9a9a9a; --line:#e6e6e6;
  --acc:#8a8a8a; --acc2:#5f5f5f; --accT:#fff;
  --green:#5a9e6e; --red:#c96a6a; --blue:#6a93c0;
  --winBg:#f0f0f0; --winTx:#444444;
  --bookA:#b8b8b8; --bookB:#8a8a8a;
  background:#fafafa; color:var(--tx);
}
body.palette-sky {
  --bg:#edf4fb; --bg2:#dceaf8; --card:#ffffff; --card2:#f4f8fc;
  --tx:#2b3a4a; --tx2:#7d8fa3; --line:#d5e2ef;
  --acc:#4d8fc9; --acc2:#3a74a8; --accT:#fff;
  --green:#4caf78; --red:#d97070; --blue:#4d8fc9;
  --winBg:#e7f0f9; --winTx:#2e6da3;
  --bookA:#7db3e0; --bookB:#4d8fc9;
  background:linear-gradient(180deg,var(--bg),var(--bg2)); color:var(--tx);
}
body.palette-mint {
  --bg:#eef7f0; --bg2:#ddf0e3; --card:#ffffff; --card2:#f3faf5;
  --tx:#2d4038; --tx2:#7fa08e; --line:#d3e8d9;
  --acc:#46a374; --acc2:#368a5f; --accT:#fff;
  --green:#46a374; --red:#d97070; --blue:#5f9bd0;
  --winBg:#e5f4ea; --winTx:#2b7d55;
  --bookA:#7cc9a0; --bookB:#46a374;
  background:linear-gradient(180deg,var(--bg),var(--bg2)); color:var(--tx);
}
body.palette-lavender {
  --bg:#f3f0fa; --bg2:#e9e4f6; --card:#ffffff; --card2:#f7f5fc;
  --tx:#37304a; --tx2:#948aa8; --line:#e0daf0;
  --acc:#7d6cc4; --acc2:#6655a8; --accT:#fff;
  --green:#46a374; --red:#d97070; --blue:#5f9bd0;
  --winBg:#ece8f8; --winTx:#5b4da3;
  --bookA:#a99ae0; --bookB:#7d6cc4;
  background:linear-gradient(180deg,var(--bg),var(--bg2)); color:var(--tx);
}
body.palette-pink {
  --bg:#fdf0f4; --bg2:#f9e2eb; --card:#ffffff; --card2:#fef7fa;
  --tx:#4a303a; --tx2:#b07890; --line:#f3d5e0;
  --acc:#e88aa8; --acc2:#d46e92; --accT:#fff;
  --green:#46a374; --red:#d97070; --blue:#5f9bd0;
  --winBg:#fbeaef; --winTx:#c4557f;
  --bookA:#f2a6c0; --bookB:#e88aa8;
  background:linear-gradient(180deg,var(--bg),var(--bg2)); color:var(--tx);
}
body.palette-gray {
  --bg:#f3f4f6; --bg2:#e8eaee; --card:#ffffff; --card2:#f7f8fa;
  --tx:#33363c; --tx2:#8a8f99; --line:#dde0e5;
  --acc:#6b7380; --acc2:#565e6a; --accT:#fff;
  --green:#5a9e6e; --red:#c96a6a; --blue:#6a93c0;
  --winBg:#eceef1; --winTx:#4a5560;
  --bookA:#9aa2ad; --bookB:#6b7380;
  background:linear-gradient(180deg,var(--bg),var(--bg2)); color:var(--tx);
}

/* ============ 换肤系统：两种风格 ============ */
/* 国风：衬线字 · 收敛圆角 · 细线边框 · 云雾底纹 · 朱印章 */
body.style-guofeng {
  font-family:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  background-image:
    radial-gradient(circle at 12% 8%, rgba(255,255,255,.55) 0, transparent 38%),
    radial-gradient(circle at 88% 26%, rgba(255,255,255,.38) 0, transparent 34%);
}
body.style-guofeng .card,
body.style-guofeng .yt-task,
body.style-guofeng .notice-item,
body.style-guofeng .task-edit-row,
body.style-guofeng .review-item,
body.style-guofeng .ov-kid { border-radius:8px; }
body.style-guofeng .btn { border-radius:7px; }
body.style-guofeng .bankbook,
body.style-guofeng .passbook { border-radius:10px; box-shadow:0 6px 18px rgba(35,35,45,.16); }
body.style-guofeng .bb-window { box-shadow:inset 0 2px 9px rgba(0,0,0,.2); }
body.style-guofeng .bb-stitch { border:1px solid rgba(255,255,255,.55); box-shadow:inset 0 0 0 3px rgba(255,255,255,.14); }
body.style-guofeng .home-hello { letter-spacing:3px; }
body.style-guofeng .login-title { letter-spacing:7px; }
body.style-guofeng .tc-name, body.style-guofeng .yt-name { letter-spacing:1px; }
body.style-guofeng .big-earn { box-shadow:0 6px 16px rgba(90,70,20,.3); }
body.style-guofeng .slip { background:#fbf7ee; }
/* 动漫：大圆角软阴影 · 弹性动画（原版基础上加活泼度） */
body.style-dongman .big-earn { animation:beat 2.6s ease-in-out infinite; }
@keyframes beat { 0%,100%{transform:scale(1);} 50%{transform:scale(1.035);} }
body.style-dongman .bb-coins { animation:beat 3.2s ease-in-out infinite; }
body.style-dongman .bankbook { border-radius:20px; }

/* 换肤面板组件 */
.swatch-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:12px 0 4px; }
.swatch {
  height:52px; border-radius:12px; border:2.5px solid transparent; position:relative;
  display:flex; align-items:flex-end; justify-content:center; font-size:.58rem; color:#fff;
  text-shadow:0 1px 3px rgba(0,0,0,.4); padding-bottom:4px;
}
.swatch.on { border-color:var(--tx); }
.swatch.on::after { content:"✓"; position:absolute; top:3px; right:5px; font-size:.75rem; }
.style-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:12px 0 4px; }
.style-opt {
  min-height:58px; border-radius:12px; border:2px solid var(--line); background:var(--card2);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  font-size:.85rem; font-weight:700; color:var(--tx);
}
.style-opt small { font-size:.6rem; color:var(--tx2); font-weight:400; }
.style-opt.on { border-color:var(--acc2); color:var(--acc2); background:var(--card); }
.theme-fab {
  position:fixed; top:calc(env(safe-area-inset-top,0px) + 12px); right:14px; z-index:60;
  width:52px; height:52px; border-radius:50%;
  background:linear-gradient(160deg,var(--bookA),var(--bookB));
  display:flex; align-items:center; justify-content:center; flex-direction:column;
  box-shadow:0 4px 16px rgba(0,0,0,.18); color:#fff; font-size:.55rem; font-weight:700;
}
.theme-fab .pf-ico { font-size:1.35rem; line-height:1; margin-bottom:1px; }
.theme-fab:active { transform:scale(.93); }

/* ============ 屏幕路由 ============ */
.screen { display:none; min-height:100vh; padding:16px 16px 30px; max-width:520px; margin:0 auto; }
.screen.active { display:block; animation:scrIn .22s ease; }
@keyframes scrIn { from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;} }

/* ============ 登录页 ============ */
#scr-login { padding-top:6vh; }
.vault-door {
  position:relative; margin:0 auto 26px; width:230px; height:230px; border-radius:50%;
  background:
    radial-gradient(circle at 35% 30%, #4a5570, #232c42 60%, #161e32);
  border:10px solid #3a4763;
  box-shadow: 0 10px 40px rgba(0,0,0,.5), inset 0 0 30px rgba(0,0,0,.6);
  display:flex; align-items:center; justify-content:center;
}
.vault-door::before {
  content:""; position:absolute; inset:24px; border-radius:50%;
  border:4px dashed #55638a; opacity:.55;
}
.vault-wheel {
  width:86px; height:86px; border-radius:50%;
  background: radial-gradient(circle at 35% 30%, #8b97b8, #3d4866);
  border:5px solid #5a688e; display:flex; align-items:center; justify-content:center;
  font-size:2rem; box-shadow:0 4px 14px rgba(0,0,0,.5);
  animation: wheelSpin 14s linear infinite;
}
@keyframes wheelSpin { to { transform:rotate(360deg); } }
.login-title { text-align:center; color:#f0e8d0; font-size:1.5rem; font-weight:800; letter-spacing:4px; margin-bottom:4px; text-shadow:0 2px 8px rgba(0,0,0,.5); }
.login-sub { text-align:center; color:#8b97b8; font-size:.78rem; margin-bottom:30px; letter-spacing:2px; }
body#loginBody { background:linear-gradient(180deg,#0a1120,#182238); color:#e8e4d8; }

.passbook {
  display:block; width:88%; max-width:340px; margin:0 auto 16px;
  border-radius:14px; padding:26px 22px; text-align:left;
  color:#fff; position:relative; overflow:hidden;
  box-shadow:0 8px 24px rgba(0,0,0,.45);
  transition:transform .15s; min-height:96px;
}
.passbook:active { transform:scale(.97); }
.pb-elder {
  background:
    repeating-linear-gradient(135deg, rgba(255,255,255,.028) 0 4px, transparent 4px 9px),
    linear-gradient(150deg,#1e3055,#0f1c36 70%);
  border:1.5px solid #33497a;
}
.pb-younger {
  background:
    radial-gradient(circle at 20% 25%, rgba(255,255,255,.35) 3px, transparent 4px),
    radial-gradient(circle at 70% 70%, rgba(255,255,255,.3) 2.5px, transparent 3.5px),
    linear-gradient(150deg,var(--bookA),var(--bookB));
  border:1.5px solid rgba(255,255,255,.65);
}
.pb-name { font-size:1.15rem; font-weight:800; margin-bottom:6px; text-shadow:0 1px 3px rgba(0,0,0,.25); }
.pb-desc { font-size:.75rem; opacity:.85; }
.pb-emblem { position:absolute; right:18px; top:50%; transform:translateY(-50%); font-size:2.1rem; opacity:.9; }
.pb-goldline { position:absolute; left:0; right:0; bottom:0; height:4px; background:linear-gradient(90deg,transparent,#f0c75e,transparent); }

.parent-lock {
  display:flex; align-items:center; justify-content:center; gap:8px;
  margin:26px auto 0; color:#8b97b8; font-size:.8rem;
  border:1px dashed #55638a; border-radius:12px; padding:12px 26px;
}

/* ============ 通用组件 ============ */
.topbar { display:flex; align-items:center; gap:10px; margin-bottom:14px; padding-top:4px; }
.topbar .back { font-size:1.35rem; color:var(--tx2); padding:4px 8px; }
.topbar .tb-title { font-size:1.05rem; font-weight:700; flex:1; }
.topbar .tb-right { font-size:.78rem; color:var(--tx2); }

.card {
  background:var(--card); border-radius:16px; padding:16px;
  box-shadow:0 2px 10px rgba(0,0,0,.06); border:1px solid var(--line);
  margin-bottom:14px;
}
.btn {
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  min-height:48px; border-radius:13px; font-size:.95rem; font-weight:700;
  padding:0 18px; transition:transform .1s, opacity .15s;
}
.btn:active { transform:scale(.97); }
.btn-gold { background:linear-gradient(160deg,#ffe08a,#e8b93c); color:#3a2c05; box-shadow:0 4px 14px rgba(212,175,55,.35); }
.btn-line { border:2px solid var(--acc2); color:var(--acc); background:transparent; }
.btn-green { background:var(--green); color:#fff; }
.btn-red-line { border:2px solid var(--red); color:var(--red); }
.btn-gray { background:var(--card2); color:var(--tx2); border:1px solid var(--line); }
.btn-block { width:100%; }

.tag { display:inline-block; font-size:.65rem; padding:2px 8px; border-radius:7px; font-weight:600; }
.tag-duty { background:rgba(94,201,124,.16); color:var(--green); }
.tag-gold { background:rgba(240,199,94,.18); color:var(--acc2); }
.theme-younger .tag-gold { background:#ffe4f0; color:var(--acc2); }
.tag-chal { background:rgba(123,184,240,.18); color:var(--blue); }

.empty-tip { text-align:center; color:var(--tx2); font-size:.82rem; padding:26px 0; }

/* ============ 孩子首页 ============ */
.home-top { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:6px; }
.home-name { font-size:.75rem; color:var(--tx2); letter-spacing:1px; }
.home-date { text-align:center; font-size:.8rem; color:var(--tx2); margin:8px 0 2px; }
.home-hello { text-align:center; font-size:1.05rem; font-weight:700; margin-bottom:18px; }

.bankbook {
  position:relative; border-radius:16px; padding:20px 18px; margin-bottom:18px;
  border:1px solid var(--line);
}
.bb-elder {
  background:
    repeating-linear-gradient(135deg, rgba(255,255,255,.025) 0 4px, transparent 4px 9px),
    linear-gradient(155deg,#1e3055,#0f1c36);
  box-shadow:0 10px 26px rgba(0,0,0,.4);
}
.bb-elder.hot { box-shadow:0 0 0 2px #c05555, 0 10px 26px rgba(0,0,0,.4); }
.bb-younger {
  background:
    radial-gradient(circle at 15% 20%, rgba(255,255,255,.4) 2.5px, transparent 3.5px),
    radial-gradient(circle at 80% 75%, rgba(255,255,255,.35) 2px, transparent 3px),
    linear-gradient(155deg,var(--bookA),var(--bookB));
  box-shadow:0 10px 26px rgba(0,0,0,.18);
}
.bb-elder.gilt { border:2px solid var(--acc2); }
.bb-stitch { border:1.5px dashed rgba(255,255,255,.35); border-radius:12px; padding:18px 14px; }
.bb-window {
  background:var(--winBg); border-radius:10px; padding:16px 12px; text-align:center;
  box-shadow:inset 0 2px 10px rgba(0,0,0,.35); position:relative; overflow:hidden;
}
.bb-window::after {
  content:""; position:absolute; top:0; bottom:0; width:40%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.14),transparent);
  left:-50%; animation: shine 3.2s ease-in-out infinite;
}
@keyframes shine { 0%,60%{left:-50%;} 100%{left:120%;} }
.bb-label { font-size:.68rem; color:var(--tx2); letter-spacing:2px; margin-bottom:6px; }
.bb-elder .bb-label { color:#8fa0bd; }
.bb-younger .bb-label { color:#ffd0e2; }
.bb-coins { font-size:2.5rem; font-weight:800; color:var(--winTx); letter-spacing:1px; display:flex; align-items:center; justify-content:center; gap:8px; }
.bb-coins .coin-ico { font-size:1.8rem; }
.bb-rmb { font-size:.85rem; color:var(--tx2); margin-top:4px; }
.bb-elder .bb-rmb { color:#8fa0bd; }
.bb-last { font-size:.7rem; color:var(--tx2); margin-top:10px; opacity:.85; }
.bb-elder .bb-last { color:#6f7f9d; }
.bb-younger .bb-last { color:#ffe4f0; }
.bb-contrib { font-size:.7rem; margin-top:6px; color:var(--green); font-weight:600; }
.bb-flowlink { text-align:right; font-size:.7rem; color:var(--tx2); margin-top:8px; text-decoration:underline; }

.pause-fab {
  position:fixed; top:calc(env(safe-area-inset-top,0px) + 12px); right:14px; z-index:60;
  width:52px; height:52px; border-radius:50%;
  background:linear-gradient(160deg,#7db8f0,#3d6fb8);
  display:flex; align-items:center; justify-content:center; flex-direction:column;
  box-shadow:0 4px 16px rgba(61,111,184,.5); opacity:.94;
  color:#fff; font-size:.55rem; font-weight:700;
}
.pause-fab .pf-ico { font-size:1.35rem; line-height:1; margin-bottom:1px; }
.pause-fab:active { transform:scale(.93); }

.home-actions { margin-top:6px; }
.big-earn {
  width:82%; margin:0 auto; display:flex; min-height:62px; border-radius:40px;
  align-items:center; justify-content:center; font-size:1.15rem; font-weight:900;
  letter-spacing:2px; box-shadow:0 8px 22px rgba(212,175,55,.4);
}
.big-earn:active { transform:scale(.97); }
.home-subbtns { display:flex; gap:12px; margin-top:14px; }
.home-subbtns .btn { flex:1; min-height:52px; font-size:.9rem; }
.bag-corner {
  position:fixed; right:14px; bottom:calc(env(safe-area-inset-bottom,0px) + 14px); z-index:60;
  width:54px; height:54px; border-radius:16px; font-size:1.5rem;
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 4px 14px rgba(0,0,0,.25);
}
.bag-elder { background:linear-gradient(160deg,#3d5a8a,#22375c); }
.bag-younger { background:linear-gradient(160deg,var(--bookA),var(--bookB)); }
.bag-corner .bag-badge {
  position:absolute; top:-5px; right:-5px; min-width:18px; height:18px; border-radius:9px;
  background:#e86a6a; color:#fff; font-size:.62rem; display:flex; align-items:center; justify-content:center; padding:0 4px;
}

.streak-flame { font-size:.75rem; color:var(--acc); text-align:center; margin-top:12px; font-weight:700; }

/* ============ 打卡页-老大（卡片滑动） ============ */
.task-swipe-wrap { position:relative; overflow:hidden; margin-top:6px; }
.task-track { display:flex; transition:transform .28s cubic-bezier(.2,.8,.25,1); }
.task-card {
  min-width:100%; padding:6px; }
.task-card-inner {
  background:var(--card); border-radius:20px; padding:26px 20px; text-align:center;
  border:1px solid var(--line); min-height:340px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px;
  box-shadow:0 4px 18px rgba(0,0,0,.08);
}
.tc-emoji { font-size:3.4rem; }
.tc-name { font-size:1.2rem; font-weight:800; line-height:1.45; }
.tc-meta { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
.tc-points { font-size:1.5rem; font-weight:900; color:var(--acc2); }
.tc-points.g { color:var(--green); }
.split-link { font-size:.72rem; color:var(--tx2); text-decoration:underline; padding:8px; }
.swipe-hint { text-align:center; font-size:.7rem; color:var(--tx2); margin:10px 0 4px; }
.swipe-dots { display:flex; gap:6px; justify-content:center; margin:8px 0 2px; }
.swipe-dots i { width:7px; height:7px; border-radius:4px; background:var(--line); transition:all .2s; }
.swipe-dots i.on { background:var(--acc2); width:20px; }

.substep-list { width:100%; text-align:left; margin-top:4px; }
.substep {
  display:flex; align-items:center; gap:10px; padding:11px 12px; border-radius:12px;
  background:var(--card2); border:1px solid var(--line); margin-bottom:8px;
}
.substep.done { opacity:.5; }
.substep .ss-ck { width:26px; height:26px; border-radius:50%; border:2px solid var(--tx2); display:flex; align-items:center; justify-content:center; font-size:.8rem; flex:none; }
.substep.done .ss-ck { background:var(--green); border-color:var(--green); color:#fff; }
.substep .ss-name { flex:1; font-size:.88rem; }
.substep .ss-pt { font-size:.8rem; font-weight:700; color:var(--acc2); }

.timer-bar { width:100%; background:var(--card2); border-radius:10px; height:14px; overflow:hidden; border:1px solid var(--line); }
.timer-fill { height:100%; width:0%; background:linear-gradient(90deg,#6aa8e8,#3d6fb8); transition:width 1s linear; border-radius:10px; }
.timer-num { font-size:1.05rem; font-weight:800; color:var(--blue); }

/* ============ 打卡页-老二（地图） ============ */
.map-progress { text-align:center; font-size:.85rem; font-weight:700; color:var(--acc2); margin-bottom:10px; }
.map-road {

const pad=n=>String(n).padStart(2,'0');

const nowHM=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes());};
const WEEK=['日','一','二','三','四','五','六'];
const fmtD=ds=>{const p=ds.split('-');return (+p[1])+'月'+(+p[2])+'日 · 周'+WEEK[new Date(+p[0],+p[1]-1,+p[2]).getDay()];};
const isFriday=()=>new Date().getDay()===5;

let AC=null;
function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC&&AC.state==='suspended')AC.resume(); return AC; }
function tone(f,dur,delay,type,vol){
  const a=ac(); if(!a||!DB||!DB.settings.sound)return;
  try{
    const o=a.createOscillator(),g=a.createGain(),t0=a.currentTime+(delay||0);
    o.type=type||'sine'; o.frequency.value=f;
    g.gain.setValueAtTime(.0001,t0);
    g.gain.exponentialRampToValueAtTime(vol||.16,t0+.02);
    g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
    o.connect(g); g.connect(a.destination); o.start(t0); o.stop(t0+dur+.06);
  }catch(e){}
}

const KEY='growthBankADHD.v1';
var DB=null;
function kidBase(name,tasks,rewards,priv){
  return {name:name,tasks:tasks,rewards:rewards,coins:0,contrib:0,flow:[],
    done:{},calmDone:'',mapPos:0,boxTickets:0,bag:priv.map(p=>({id:p.id,emoji:p.emoji,name:p.name,desc:p.desc,use:p.use,type:'priv',got:'初始配发'})),
    chgDates:[],hot:null};
}
function freshDB(){
  return {v:1,
    elder:kidBase('哥哥',T_Elder,R_Elder,PRIV_Elder),
    younger:kidBase('哥哥',T_Younger,R_Younger,PRIV_Younger),
    reviews:[],notices:[],
    settings:{pwd:'2026',rate:10,friday:true,sound:true,boxCost:10,theme:{palette:'sky',style:'dongman'}}};
}
function loadDB(){
  try{ const raw=localStorage.getItem(KEY); DB=raw?JSON.parse(raw):null; }catch(e){ DB=null; }
  if(!DB||!DB.elder||!DB.younger||!DB.settings) DB=freshDB();
  const f=freshDB();
  DB.settings=Object.assign({},f.settings,DB.settings);
  ['elder','younger'].forEach(k=>{ DB[k]=Object.assign({},f[k],DB[k]); });
  migrateDB(f);
  save();
}

/* ---- 数据同步：默认任务/奖励定义升级（保留自定义项与打卡记录） ---- */
function migrateDB(f){
  ['elder','younger'].forEach(k=>{
    // 同步任务列表：以默认清单为准，保留自定义任务的 ID 不变
    const def=f[k].tasks;
    const custom=DB[k].tasks.filter(t=>!def.find(d=>d.id===t.id));
    // 默认任务用最新定义覆盖（拾取最新 emoji/name/pts/split/timer），保留已有打卡记录兼容
    DB[k].tasks=def.map(d=>{
      const old=DB[k].tasks.find(t=>t.id===d.id);
      return old?Object.assign({},old,d):d;
    }).concat(custom);
    // 同步奖励库
    const defR=f[k].rewards;
    const customR=DB[k].rewards.filter(r=>!defR.find(d=>d.id===r.id));
    DB[k].rewards=defR.map(d=>{
      const old=DB[k].rewards.find(r=>r.id===d.id);
      return old?Object.assign({},old,d):d;
    }).concat(customR);
  });
}
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(DB)); }catch(e){} }

/* ===================== 账务核心 ===================== */
function addFlow(k,s,c,reason){
  DB[k].flow.unshift({d:todayStr(),t:nowHM(),s:s,c:c,r:reason});
  if(DB[k].flow.length>300)DB[k].flow.length=300;
}
function doneToday(k){ const a=DB[k].done[todayStr()]; return Array.isArray(a)?a:[]; }
const doneCount=k=>DB[k].tasks.filter(t=>doneToday(k).includes(t.id)).length;
function streakOf(k){
  const days=Object.keys(DB[k].done).filter(d=>DB[k].done[d]&&DB[k].done[d].length);
  if(!days.length)return 0;
  const set=new Set(days);
  let d=new Date();
  if(!set.has(todayStr())) d.setDate(d.getDate()-1);
  let n=0;
  for(;;){
    const cur=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
    if(!set.has(cur))break;
    n++; d.setDate(d.getDate()-1);
  }
  return n;
}
function isAllDutyDone(k){
  return DB[k].tasks.filter(t=>t.type==='duty').every(t=>doneToday(k).includes(t.id));
}
function mapAdvance(){
  const y=DB.younger; y.mapPos++;
  let gift=null;
  if(y.mapPos>=10){ y.boxTickets++; y.mapPos=0; gift='🏆 小鹿走完全程！获得盲盒券×1'; }
  else if(y.mapPos===5){ y.boxTickets++; gift='🎁 中途宝箱！获得盲盒券×1'; }
  if(gift)addFlow('younger','+',0,gift);
  return gift;
}
function completeTask(k,task){
  const ts=todayStr(); const arr=DB[k].done[ts]||(DB[k].done[ts]=[]);
  if(arr.includes(task.id))return null;
  arr.push(task.id);
  if(k==='elder'&&task.type==='duty'){
    DB.elder.contrib+=task.pts; addFlow('elder','+',task.pts,'[努力分] '+task.name);
  }else{
    DB[k].coins+=task.pts; addFlow(k,'+',task.pts,'[金币] '+task.name);
    if(k==='younger'&&task.type==='duty')DB.younger.contrib+=1;
  }
  let gift=null;
  if(k==='younger'){
    gift=mapAdvance();
    if(isAllDutyDone('younger')&&!DB.younger.chgDates.includes(ts))DB.younger.chgDates.push(ts);
  }
  save();
  return {gift:gift};
}
function notice(msg,warn){
  DB.notices.unshift({d:todayStr(),t:nowHM(),msg:String(msg),warn:!!warn});
  if(DB.notices.length>80)DB.notices.length=80;
}

function bindSwipe(n){
  const w=$('#tsw'); if(!w)return;

  w.addEventListener('touchend',e=>{
    const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
    if(Math.abs(dx)>44&&Math.abs(dx)>Math.abs(dy)*1.2){

function calmExit(){ clearInterval(iceT); clearInterval(breathTimer); goKid(KID||'elder'); }
function renderCalm(step){
  clearInterval(breathTimer); clearInterval(iceT);
  const el=$('#scr-calm');
  const bar='<div class="topbar"><button class="back" onclick="calmExit()">‹</button><div class="tb-title">冷静室</div><div class="tb-right">第 '+step+' / 3 步</div></div>';

     <div class="ice-block" id="iceBlock"><div class="ice-fire" id="iceFire">🔥</div><div class="ice-frost" id="iceFrost"></div></div>
     <div class="ice-progress"><div class="bar"><div class="fill" id="iceFill"></div></div><div class="txt" id="iceTxt">按住冰块，别松手…</div></div>`;
    bindIce();
  }else if(step===2){
    el.innerHTML=bar+`
     <div class="calm-title">🌊 跟着圆圈呼吸</div>
     <div class="calm-sub">圆圈变大时吸气，变小时呼气<br>一共两轮，8秒一轮</div>
     <div class="breath-circle">🌊</div>
     <div class="breath-word" id="breathW">吸 ——</div>
     <div class="ice-progress"><div class="bar"><div class="fill" style="width:0%" id="bFill"></div></div><div class="txt" id="bTxt">第 1 / 2 轮</div></div>
     <div class="calm-exits"><button class="btn btn-line" id="bNext" style="display:none" onclick="renderCalm(3)">我平静多了，下一步 →</button></div>`;
    let ph=0;
    const w=()=>$('#breathW');
    breathTimer=setInterval(()=>{
      ph++;
      if(ph>=4){
        clearInterval(breathTimer);
        if(w())w().textContent='🌊';
        const bf=$('#bFill'); if(bf)bf.style.width='100%';
        const bt=$('#bTxt'); if(bt)bt.textContent='两轮完成，太棒了';
        const bn=$('#bNext'); if(bn){bn.style.display='block';sDing();}
        return;
      }
      if(w())w().textContent=(ph%2===1)?'呼 ——':'吸 ——';
      const bf=$('#bFill'); if(bf)bf.style.width=(ph*25)+'%';
      const bt=$('#bTxt'); if(bt)bt.textContent='第 '+(Math.floor(ph/2)+1)+' / 2 轮';
    },4000);
  }else{
    el.innerHTML=bar+`
     <div class="calm-title">🏆 火山熄灭了</div>
     <div class="calm-sub">停下来就是胜利。<br>现在感觉怎么样？</div>
     <div class="calm-exits">
       <button class="btn btn-green" onclick="calmFinish('还好')">😌 还好</button>
       <button class="btn btn-line" onclick="calmFinish('有点气')">😣 还有点气</button>
       <button class="btn btn-line" onclick="calmFinish('很生气')">😡 还是很气</button>
     </div>`;
  }
}
function bindIce(){
  const b=$('#iceBlock'); if(!b)return;
  let holding=false;
  clearInterval(iceT); iceP=0;
  iceT=setInterval(()=>{
    if(iceP>=100)return;
    if(holding)iceP=Math.min(100,iceP+2.4);
    else iceP=Math.max(0,iceP-3);
    icePaint();
    if(iceP>=100)iceDone();
  },50);
  b.addEventListener('pointerdown',e=>{holding=true;try{b.setPointerCapture(e.pointerId);}catch(x){}});
  b.addEventListener('pointerup',()=>holding=false);
  b.addEventListener('pointercancel',()=>holding=false);
}
function icePaint(){
  const f=$('#iceFrost'); if(!f)return;
  f.style.clipPath='inset('+(100-iceP)+'% 0 0 0)';
  const g=$('#iceFill'); if(g)g.style.width=iceP+'%';
  const t=$('#iceTxt');
  if(t)t.textContent=iceP>=100?'熄灭了！':(iceP>0?'冰冻中 '+Math.round(iceP)+'% · 按住别松':'按住冰块，别松手…');
}
function iceDone(){
  clearInterval(iceT); sDing();
  const fire=$('#iceFire');
  if(fire){fire.style.opacity='0';fire.style.transform='scale(.2)';}
  const t=$('#iceTxt'); if(t)t.textContent='熄灭了！好凉快 😎';
  setTimeout(()=>renderCalm(2),900);
}

     <div class="box-visual bx-${k}" id="boxV">🎁</div>
     <div class="shake-tip">${free?'你有免费盲盒券 ×'+u.boxTickets+' · 按住盒子用力摇':'按住盒子左右用力摇，或甩动手机'}</div>
     <div class="shake-bar ice-progress"><div class="bar"><div class="fill" id="boxFill"></div></div><div class="txt" id="boxTxt">${free?'本次免费（用券 1 张）':'消耗 '+S.boxCost+' 金币/次'} · 余额 ${u.coins} 币</div></div>
     <button class="btn btn-line" style="margin-top:14px" onclick="reqMotion()">📱 开启手机甩一甩</button>
   </div>`;
  bindBox();
}
function bindBox(){
  const b=$('#boxV'); if(!b)return;
  let lx=0,ly=0,down=false;
  b.addEventListener('pointerdown',e=>{down=true;lx=e.clientX;ly=e.clientY;b.classList.add('shaking');});
  b.addEventListener('pointermove',e=>{
    if(!down||boxBusy)return;
    boxEnergy+=Math.abs(e.clientX-lx)+Math.abs(e.clientY-ly);
    lx=e.clientX; ly=e.clientY; boxPaint();
  });
  const up=()=>{down=false;b.classList.remove('shaking');};
  b.addEventListener('pointerup',up);
  b.addEventListener('pointercancel',up);
}
function boxPaint(){
  const p=Math.min(100,boxEnergy/6);
  const f=$('#boxFill'); if(f)f.style.width=p+'%';
  if(p>=14&&p<22)sTick();
  if(p>=100&&!boxBusy){ boxBusy=true; boxOpen(); }
}
function reqMotion(){
  if(motionOn){ sPop(); return; }
  const bind=()=>{
    window.addEventListener('devicemotion',e=>{
      const a=e.accelerationIncludingGravity;
      const boxScr=document.getElementById('scr-box');
      if(!a||!boxScr||!boxScr.classList.contains('active'))return;
      const m=Math.abs(a.x||0)+Math.abs(a.y||0)+Math.abs(a.z||0);
      if(m>22){
        boxEnergy+=m*1.2;
        const b=$('#boxV');
        if(b){b.classList.add('shaking');clearTimeout(b._st);b._st=setTimeout(()=>{if(b)b.classList.remove('shaking');},300);}
        boxPaint();
      }
    });
    motionOn=true;
    modal('<div style="text-align:center;padding:10px">✅ 甩一甩已开启<br><span style="font-size:.75rem;color:var(--tx2)">用力甩动手机即可摇盒</span></div>'+btnClose('好的'));
  };
  if(typeof DeviceMotionEvent!=='undefined'&&typeof DeviceMotionEvent.requestPermission==='function'){
    DeviceMotionEvent.requestPermission().then(r=>{
      if(r==='granted')bind();
      else modal('<div style="text-align:center;padding:10px">⚠️ 未获得动作权限<br><span style="font-size:.75rem;color:var(--tx2)">仍可按住盒子左右滑动摇</span></div>'+btnClose());
    }).catch(()=>{});
  }else bind();
}
function boxOpen(){
  const k=KID,u=DB[k],S=DB.settings;
  const b=$('#boxV');
  if(b){b.classList.remove('shaking');b.classList.add('cracking');}
  if(u.boxTickets<=0&&u.coins<S.boxCost){ boxBusy=false; boxEnergy=0; renderBox(); return; }
  sDing();
  const pool=(k==='elder')?BOX_Elder:BOX_Younger;
  const p=pool[Math.floor(Math.random()*pool.length)];
  const useTicket=u.boxTickets>0;
  if(useTicket)u.boxTickets--;
  else{ u.coins-=S.boxCost; addFlow(k,'-',S.boxCost,'购买盲盒'); }
  DB.reviews.unshift({id:uid(),kid:k,type:'box',prize:{e:p.e,n:p.n},status:'pending',time:todayStr()+' '+nowHM()});
  addFlow(k,'+',0,'摇出「'+p.n+'」待行长确认');
  notice(u.name+' 摇出盲盒：'+p.n+'（待确认发放）');
  save();
  setTimeout(()=>{
    confetti(36); sGood();
    modal('<div class="prize-card"><div class="pz-emoji">'+p.e+'</div><div class="pz-name">'+esc(p.n)+'</div><div class="pz-exec">奖品已登记，等行长（爸妈）盖章后放进背包</div></div>'
     +slip('盲盒凭条',[['户名',u.name],['支付',useTicket?'免费盲盒券':(S.boxCost+' 金币')],['奖品',p.n]],'待发放','pink')
     +btnClose('好期待！'));
    boxEnergy=0; boxBusy=false;
    renderBox();
  },700);
}

function usePriv(id){
  const k=KID,u=DB[k];

function exchange(rid){
  const k=KID,u=DB[k];
  const r=u.rewards.find(x=>x.id===rid); if(!r)return;

  u.coins-=r.cost;
  addFlow(k,'-',r.cost,'兑换「'+r.name+'」');
  u.bag.push({id:uid(),emoji:r.emoji,name:r.name,desc:'已兑换奖励 · 找爸妈兑现',type:'prize',got:todayStr()});
  notice(u.name+' 兑换了「'+r.name+'」（-'+r.cost+'币）');

  modal(slip('兑换凭条',[['户名',u.name],['奖品',r.name],['支付',r.cost+' 金币'],['余额',u.coins+' 币']],'已兑换','green','拿这张凭条找爸妈兑现奖励。')+btnClose('去兑现'));

function toggleHot(){

function addTask(k){
  const em=($('#tk-em-'+k).value||'⭐').trim();
  const nm=($('#tk-nm-'+k).value||'').trim();
  const tp=$('#tk-tp-'+k).value;
  const pt=Math.max(1,Math.min(9,parseInt($('#tk-pt-'+k).value)||1));
  const sp=($('#tk-sp-'+k).value||'').split('\n').map(s=>s.trim()).filter(Boolean);
  if(!nm){ sBad(); return; }
  DB[k].tasks.push({id:uid(),emoji:em,name:nm,type:tp,pts:pt,split:sp});
  save(); sPop(); renderParent(2);
}
function delTask(k,id){
  DB[k].tasks=DB[k].tasks.filter(t=>t.id!==id);
  save(); sPop(); renderParent(2);
}
function addReward(k){
  const em=($('#rw-em-'+k).value||'🎁').trim();
  const nm=($('#rw-nm-'+k).value||'').trim();
  const cs=Math.max(1,parseInt($('#rw-cs-'+k).value)||5);
  if(!nm){ sBad(); return; }
  DB[k].rewards.push({id:uid(),emoji:em,name:nm,cost:cs});
  save(); sPop(); renderParent(2);
}
function delReward(k,id){
  DB[k].rewards=DB[k].rewards.filter(r=>r.id!==id);
  save(); sPop(); renderParent(2);
}
function reviewAct(id,ok){
  const r=DB.reviews.find(x=>x.id===id);
  if(!r||r.status!=='pending')return;
  r.status=ok?'ok':'no';
  if(r.type==='withdraw'){
    if(ok){ addFlow(r.kid,'+',0,'取款 '+r.amount+' 元已批准 · 家长支付现金'); notice('已批准 '+DB[r.kid].name+' 取款 '+r.amount+' 元，请支付现金'); }
    else{ DB[r.kid].coins+=r.coins; addFlow(r.kid,'+',r.coins,'取款被退回 · 金币解冻'); notice('退回了 '+DB[r.kid].name+' 的取款申请'); }
  }else if(r.type==='box'){
    if(ok){
      DB[r.kid].bag.push({id:uid(),emoji:r.prize.e,name:r.prize.n,desc:'盲盒奖品 · 找爸妈兑现',type:'prize',got:todayStr()});
      notice('已发放盲盒奖品「'+r.prize.n+'」给 '+DB[r.kid].name);
    }else{ addFlow(r.kid,'+',0,'盲盒「'+r.prize.n+'」未发放'); notice('未发放 '+DB[r.kid].name+' 的盲盒奖品'); }
  }
  save(); ok?sGood():sBad(); renderParent(1);
}
function saveSettings(){
  const S=DB.settings;
  const nmE=($('#st-nm-elder').value||'').trim();
  if(nmE)DB.elder.name=nmE.slice(0,8);
  const p=($('#st-pwd').value||'').trim();
  if(/^\d{4}$/.test(p))S.pwd=p;
  S.rate=Math.max(2,Math.min(50,parseInt($('#st-rate').value)||10));
  S.boxCost=Math.max(1,Math.min(99,parseInt($('#st-box').value)||10));
  save(); sPop(); renderParent(3);
  modal('<div style="text-align:center;padding:10px">✅ 设置已保存</div>'+btnClose('好'));
}
function askReset(){
  modal('<div style="text-align:center;font-weight:800;margin-bottom:8px">⚠️ 清空全部数据？</div>'
   +'<div style="font-size:.8rem;color:var(--tx2);line-height:1.6">金币、任务、流水、背包全部归零，无法恢复。</div>'
   +'<div style="display:flex;gap:10px;margin-top:12px">'
   +'<button class="btn btn-gray" style="flex:1" onclick="closeModal()">取消</button>'
   +'<button class="btn btn-red-line" style="flex:1" onclick="doReset()">确认清空</button></div>');
}
function doReset(){
  try{ localStorage.removeItem(KEY); }catch(e){}
  closeModal(); loadDB(); sBad(); renderParent(0);
}

/* ===================== 初始化 ===================== */
$('#modalLayer').addEventListener('click',e=>{ if(e.target.id==='modalLayer')closeModal(); });
document.addEventListener('pointerdown',()=>ac(),{once:true});
document.addEventListener('visibilitychange',()=>{ if(document.hidden)clearAllTimers(); });
loadDB();
goLogin();

/* ===================== URL 直达（收藏/主屏幕深链） =====================
   ?go=elder|tasks|withdraw|box|bag|flow|pwd|parent
   ?p=管理密码（go=parent 时必须携带，不设后门） */
(function(){
  try{
    const q=new URLSearchParams(location.search);
    const g=q.get('go');
    if(!g)return;
    const k='elder';
    if(g==='elder')goKid('elder');
    else if(g==='younger')goKid('elder');
    else if(g==='tasks'){ goKid(k); openTasks(); }
    else if(g==='withdraw'){ goKid(k); openWithdraw(); }
    else if(g==='box'){ goKid(k); openBox(); }
    else if(g==='bag'){ goKid(k); openBag(); }
    else if(g==='flow'){ openFlow(k); }
    else if(g==='calm'){ goKid(k); enterCalm(); }
    else if(g==='pwd'){ applyTheme(); document.body.id=''; renderPwd(); go('pwd'); }
    else if(g==='parent'&&q.get('p')===DB.settings.pwd){ applyTheme(); document.body.id=''; renderParent(0); go('parent'); }
  }catch(e){}
})();
</script>
